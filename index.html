<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>账单系统</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>账单系统</h1>
      <p>在线录入、自动归类、实时汇总</p>
    </div>
    <div class="status" id="connectionStatus">连接中</div>
  </header>

  <main class="layout">
    <section class="panel entry-panel">
      <div class="panel-title">
        <h2>新增账单</h2>
        <span>输入一句话即可自动识别</span>
      </div>
      <form id="entryForm" class="entry-form">
        <label>
          日期
          <input id="entryDate" type="date" required>
        </label>
        <label>
          内容
          <input id="rawText" type="text" placeholder="例如：百星辰购买XXX软件" required>
        </label>
        <label>
          金额
          <input id="amount" type="number" step="0.001" min="0" placeholder="120" required>
        </label>
        <label>
          项目名称
          <input id="itemName" type="text" placeholder="自动提取，也可以手动改">
        </label>
        <div class="preview" id="recognitionPreview">等待输入内容</div>
        <button type="submit">保存账单</button>
      </form>
    </section>

    <section class="kpis">
      <div class="kpi"><span>原账单金额</span><strong id="kpiBase">0.000</strong></div>
      <div class="kpi"><span>公共分摊</span><strong id="kpiShare">0.000</strong></div>
      <div class="kpi"><span>最终合计</span><strong id="kpiFinal">0.000</strong></div>
      <div class="kpi"><span>未识别</span><strong id="kpiUnknown">0</strong></div>
    </section>

    <section class="panel">
      <div class="panel-title">
        <h2>分组汇总</h2>
        <span>按最终规则自动更新</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>组别</th><th>人数</th><th>原账单金额</th><th>公共分摊</th><th>最终合计</th>
            </tr>
          </thead>
          <tbody id="summaryBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title">
        <h2>人员明细</h2>
        <input id="personSearch" class="search" type="search" placeholder="搜索人名或组别">
      </div>
      <div class="table-wrap tall">
        <table>
          <thead>
            <tr>
              <th>组别</th><th>姓名</th><th>原账单</th><th>分摊</th><th>最终合计</th><th>明细数</th>
            </tr>
          </thead>
          <tbody id="peopleBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title">
        <h2>账单记录</h2>
        <select id="statusFilter">
          <option value="">全部</option>
          <option value="已识别">已识别</option>
          <option value="未识别">未识别</option>
        </select>
      </div>
      <div class="table-wrap tall">
        <table>
          <thead>
            <tr>
              <th>日期</th><th>内容</th><th>姓名</th><th>组别</th><th>金额</th><th>状态</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="ledgerBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="editDialog">
    <form method="dialog" id="editForm" class="entry-form dialog-form">
      <h2>修改账单</h2>
      <input type="hidden" id="editId">
      <label>日期<input id="editDate" type="date" required></label>
      <label>内容<input id="editRawText" type="text" required></label>
      <label>金额<input id="editAmount" type="number" step="0.001" min="0" required></label>
      <label>项目名称<input id="editItemName" type="text"></label>
      <div class="preview" id="editPreview"></div>
      <div class="dialog-actions">
        <button value="cancel" type="button" id="cancelEdit">取消</button>
        <button value="default" type="submit">保存修改</button>
      </div>
    </form>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
